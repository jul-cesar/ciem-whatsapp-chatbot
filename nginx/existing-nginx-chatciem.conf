# Configuracion para agregar al Nginx existente
# Archivo: /etc/nginx/conf.d/chatciem.conf
#
# Despues de agregar este archivo, recargar Nginx:
# docker exec sie-ciem-nginx nginx -s reload

server {
    listen 80;
    server_name chatciem.cecar.edu.co;

    location / {
        proxy_pass http://host.docker.internal:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

